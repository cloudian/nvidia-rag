# AIDP - AI Data Pipeline Docker Compose
# Event-driven document ingestion with Kafka + Cloudian HyperStore
#
# Unlike docker-compose.yaml (which runs a local MinIO instance as the S3
# source), HyperStore is an existing, external S3-compatible system - it is
# not deployed by this file. Only the Kafka broker used to relay HyperStore's
# bucket notifications, and the kafka-consumer itself, run here.
#
# Usage:
#   docker compose -f docker-compose.yaml up -d
#
# Prerequisites:
#   - AIDP RAG stack installed per the Cloudian HyperScale AIDP Install Guide
#     (ingestor-server reachable, e.g. via its exposed NodePort)
#   - HyperStore v8.2.9 (or later) with the SQS service and bucket
#     notifications feature enabled, and a Kafka queue + bucket notification
#     configured to publish to the "kafka" broker below (see the
#     "Continuous Ingestion from HyperStore" section of the install guide)

services:
  # =============================================================================
  # KAFKA (KRaft - no Zookeeper needed)
  # =============================================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://${HOST_IP:-localhost}:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_RETENTION_HOURS=168
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - aidp-hs-ingest
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aidp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: aidp-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks:
      - aidp-hs-ingest

  # =============================================================================
  # KAFKA CONSUMER (Event-driven Ingestion from HyperStore)
  # =============================================================================
  kafka-consumer:
    build:
      context: ../kafka_consumer
      dockerfile: Dockerfile
    image: kafka-consumer-hyperstore:local
    container_name: kafka-consumer-hyperstore
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Kafka - HyperStore's bucket notification queue must publish to this
      # same broker, on the port reachable from the HyperStore node(s)
      # (EXTERNAL listener, ${HOST_IP}:9094 - see the install guide).
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-aidp-hs-topic}
      - CONSUMER_GROUP=${CONSUMER_GROUP:-nvingest-consumer-group}
      # HyperStore S3 endpoint and credentials (root user - see install guide)
      - HYPERSTORE_ENDPOINT=${HYPERSTORE_ENDPOINT:?Set HYPERSTORE_ENDPOINT, e.g. s3-region-1.mydomain.com:80}
      - HYPERSTORE_ACCESS_KEY=${HYPERSTORE_ACCESS_KEY:?Set HYPERSTORE_ACCESS_KEY}
      - HYPERSTORE_SECRET_KEY=${HYPERSTORE_SECRET_KEY:?Set HYPERSTORE_SECRET_KEY}
      - HYPERSTORE_SECURE=${HYPERSTORE_SECURE:-false}
      # RAG Ingestor - the AIDP node's own IP and the ingestor-server NodePort
      # exposed per the install guide's "Expose Services" step
      - INGESTOR_SERVER_URL=${INGESTOR_SERVER_URL:?Set INGESTOR_SERVER_URL, e.g. http://aidp-host:30085}
      - COLLECTION_NAME=${COLLECTION_NAME:-aidp_bucket}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    networks:
      - aidp-hs-ingest

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  kafka-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  aidp-hs-ingest:
    driver: bridge
